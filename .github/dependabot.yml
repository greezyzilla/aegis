# Monthly, grouped, and only versions at least a week old (cooldown): fewer PRs, and a freshly
# published malicious version usually gets caught and pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      # Runtime deps ship in the extension (patch release); dev deps do not.
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
