# Light check on every push: typecheck, lint, format, unit tests, both builds (~1 min on ubuntu).
# The Playwright and Firefox e2e suites stay local: they need browsers and minutes.
name: check
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build && npm run build:firefox
