# release-please builds the changelog from the commits on main. A PR lands with a merge commit
# whose body is the PR title, and release-please parses that line too, so a Conventional PR title
# would be counted twice. Every commit in a PR must be a Conventional Commit; the title must not be.
# Bot PRs (release-please, Dependabot) are one commit and squash-merged, so they keep theirs.
name: pr-title
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
permissions:
  pull-requests: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Reads the title and the commits through the API only; nothing from the PR is checked out or run.
      - name: Check the commit messages and the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          conventional='^(feat|fix|perf|refactor|style|test|docs|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]'
          fail=0
          while IFS=$'\t' read -r sha parents subject; do
            # Merges from main ("Update branch") are not changes of their own.
            [ "$parents" -gt 1 ] && continue
            if ! printf '%s' "$subject" | grep -Eq "$conventional"; then
              echo "::error::Commit ${sha:0:7} is not a Conventional Commit: $subject"
              fail=1
            fi
          done < <(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | [.sha, (.parents | length), (.commit.message | split("\n")[0])] | @tsv')
          case "$AUTHOR" in
            'github-actions[bot]' | 'dependabot[bot]') ;;
            *)
              if printf '%s' "$TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!?:'; then
                echo "::error::Write the PR title as a plain sentence: the merge commit carries it, and release-please would count a Conventional title twice."
                fail=1
              fi
              ;;
          esac
          exit $fail
