# PRs are squash-merged with the PR title as the commit message, and release-please builds the
# changelog from those messages: the title must be a Conventional Commit (feat: ..., fix(popup): ...).
name: pr-title
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
permissions:
  pull-requests: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Reads the title through the API only; nothing from the PR is checked out or run.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
